################
### MONITORS ###
################

# Без единого monitorrule mango берёт предпочитаемый режим каждого выхода --
# то есть родное разрешение и частоту. Для ноутбука это почти всегда то, что
# нужно, поэтому по умолчанию здесь ничего не задано.
#
# Правила нужны, только когда автоматика не устраивает: другой масштаб,
# нестандартная частота, или несколько мониторов, которые надо разложить в
# определённом порядке.
#
# Имена выходов посмотреть так:
#
#   wlr-randr
#   mmsg get all-monitors
#
# Поля: name / make / model для отбора, затем width, height, refresh, x, y,
# scale. name понимает регулярное выражение.

# Внутренний экран ноутбука: своё разрешение, увеличенный масштаб.
#monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.2

# Внешний монитор, отобранный по модели, и внутренний под ним.
#monitorrule=model:ZQE-CBA,width:2560,height:1080,refresh:60,x:0,y:0,scale:1
#monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:320,y:1080,scale:1.2

# Отбор по производителю и модели вместо имени выхода: имя может меняться
# от порта к порту, модель -- нет.
#monitorrule=make:Chimei Innolux Corporation,model:0x15F5,width:1920,height:1080,refresh:60,x:0,y:0

# Виртуальный монитор для удалённого доступа.
#monitorrule=name:HEADLESS-.*,width:1920,height:1080,refresh:60,x:1926,y:0,scale:1,rr:0,vrr:0
