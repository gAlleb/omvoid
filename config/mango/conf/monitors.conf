################
### MONITORS ###
################

# With no monitor_rule, Mango uses each output's preferred resolution and
# refresh rate. This is normally the right default for a laptop.
#
# Add rules only for a different scale, refresh rate or monitor arrangement.
#
# Inspect output names with:
#
#   wlr-randr
#   mmsg get all-monitors
#
# Match by name / make / model, then set width, height, refresh, x, y and
# scale. The name field accepts a regular expression.

# Internal laptop screen with a larger scale.
#monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.2

# External monitor matched by model, with the internal screen below it.
#monitor_rule=model:ZQE-CBA,width:2560,height:1080,refresh:60,x:0,y:0,scale:1
#monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:320,y:1080,scale:1.2

# Match by manufacturer and model when connector names vary between ports.
#monitor_rule=make:Chimei Innolux Corporation,model:0x15F5,width:1920,height:1080,refresh:60,x:0,y:0

# Virtual monitor for remote access.
#monitor_rule=name:HEADLESS-.*,width:1920,height:1080,refresh:60,x:1926,y:0,scale:1,rr:0,vrr:0
