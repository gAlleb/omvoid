# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config  # reload config

# menu and terminal
bind=ALT,o,spawn,omvoid-app-menu  # app menu
bind=ALT,Return,spawn,alacritty  # terminal
bind=ALT,i,spawn,omvoid-launch-agent  # AI agent

# exit
bind=SUPER+ALT+SHIFT,m,quit  # quit the session
bind=ALT,c,killclient,  # close window
bind=SUPER,w,spawn,omvoid-reload-waybar  # restart the bar

# switch window focus
bind=SUPER,Tab,focusstack,next  # next window
bind=ALT,Left,focusdir,left  # focus left
bind=ALT,Right,focusdir,right  # focus right
bind=ALT,Up,focusdir,up  # focus up
bind=ALT,Down,focusdir,down  # focus down
bind=SUPER+SHIFT,Up,exchange_client,up  # swap window up
bind=SUPER+SHIFT,Down,exchange_client,down  # swap window down
bind=SUPER+SHIFT,Left,exchange_client,left  # swap window left
bind=SUPER+SHIFT,Right,exchange_client,right  # swap window right

# switch window status
bind=SUPER,g,toggleglobal,  # show on every desktop
bind=ALT,Tab,toggleoverview,  # window overview
bind=ALT+SHIFT,space,togglefloating,  # floating window
bind=ALT,y,togglemaximizescreen,  # maximise to screen
bind=ALT+SHIFT,f,togglefullscreen,  # fullscreen
bind=ALT+SHIFT+SUPER,f,togglefakefullscreen,  # fake fullscreen
bind=SUPER,i,minimized,  # minimise window
bind=SUPER,o,toggleoverlay,  # keep on top
bind=SUPER+SHIFT,I,restore_minimized  # restore minimised
bind=ALT,z,toggle_scratchpad  # scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0  # equal proportions
bind=ALT,x,switch_proportion_preset,  # next proportion preset

# switch layout
bind=SUPER,n,switch_layout  # next layout
bind=SUPER,d,setlayout,scroller  # scroller layout
bind=SUPER,t,setlayout,tile  # tile layout

# tag switch
bind=SUPER,Left,viewtoleft,0  # desktop to the left
bind=CTRL,Left,viewtoleft_have_client,0  # desktop to the left that has windows
bind=SUPER,Right,viewtoright,0  # desktop to the right
bind=CTRL,Right,viewtoright_have_client,0  # desktop to the right that has windows
bind=CTRL+SUPER,Left,tagtoleft,0  # window to the desktop on the left
bind=CTRL+SUPER,Right,tagtoright,0  # window to the desktop on the right

bind=ALT,1,view,1,0  # desktop 1
bind=ALT,2,view,2,0  # desktop 2
bind=ALT,3,view,3,0  # desktop 3
bind=ALT,4,view,4,0  # desktop 4
bind=ALT,5,view,5,0  # desktop 5
bind=ALT,6,view,6,0  # desktop 6
bind=ALT,7,view,7,0  # desktop 7
bind=ALT,8,view,8,0  # desktop 8
bind=ALT,9,view,9,0  # desktop 9

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=ALT,1,tagsilent,1
bind=ALT+SHIFT,1,tag,1,0  # window to desktop 1
bind=ALT+SHIFT,2,tag,2,0  # window to desktop 2
bind=ALT+SHIFT,3,tag,3,0  # window to desktop 3
bind=ALT+SHIFT,4,tag,4,0  # window to desktop 4
bind=ALT+SHIFT,5,tag,5,0  # window to desktop 5
bind=ALT+SHIFT,6,tag,6,0  # window to desktop 6
bind=ALT+SHIFT,7,tag,7,0  # window to desktop 7
bind=ALT+SHIFT,8,tag,8,0  # window to desktop 8
bind=ALT+SHIFT,9,tag,9,0  # window to desktop 9

# monitor switch
bind=alt+shift,Left,focusmon,left  # focus the monitor on the left
bind=alt+shift,Right,focusmon,right  # focus the monitor on the right
bind=alt+shift,Up,focusmon,up  # focus the monitor above
bind=alt+shift,Down,focusmon,down  # focus the monitor below
bind=SUPER+ALT,Left,tagmon,left  # window to the monitor on the left
bind=SUPER+ALT,Right,tagmon,right  # window to the monitor on the right
bind=SUPER+ALT,Up,tagmon,up  # window to the monitor above
bind=SUPER+ALT,Down,tagmon,down  # window to the monitor below

# gaps
bind=ALT+SHIFT,X,incgaps,1  # wider gaps
bind=ALT+SHIFT,Z,incgaps,-1  # narrower gaps
bind=ALT+SHIFT,R,togglegaps  # gaps on/off

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50  # nudge window up
bind=CTRL+SHIFT,Down,movewin,+0,+50  # nudge window down
bind=CTRL+SHIFT,Left,movewin,-50,+0  # nudge window left
bind=CTRL+SHIFT,Right,movewin,+50,+0  # nudge window right

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50  # window shorter
bind=CTRL+ALT,Down,resizewin,+0,+50  # window taller
bind=CTRL+ALT,Left,resizewin,-50,+0  # window narrower
bind=CTRL+ALT,Right,resizewin,+50,+0  # window wider

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_middle,moveresize,curresize
mousebind=ALT,btn_left,moveresize,curresize
# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# Gesturebind
gesturebind=none,left,4,focusdir,left
gesturebind=none,right,4,focusdir,right
gesturebind=none,up,4,focusdir,up
gesturebind=none,down,4,focusdir,down
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

bind=SUPER,0,toggleoverview  # window overview
bind=none,XF86AudioRaiseVolume, spawn, swayosd-client --output-volume 5  # volume up
bind=none,XF86AudioLowerVolume, spawn, swayosd-client --output-volume -5  # volume down
bind=none,XF86AudioMute, spawn, swayosd-client --output-volume mute-toggle  # mute
bind=none,XF86MonBrightnessUp, spawn, swayosd-client --brightness +10  # screen brighter
bind=none,XF86MonBrightnessDown, spawn, swayosd-client --brightness -10  # screen dimmer
bind=none,XF86KbdBrightnessUp, spawn, ~/.config/hypr/scripts/kbdbacklight.sh up  # keyboard backlight up
bind=none,XF86KbdBrightnessDown, spawn, ~/.config/hypr/scripts/kbdbacklight.sh down  # keyboard backlight down
# Requires playerctl
bind=none,XF86AudioNext, spawn, playerctl next  # next track
bind=none,XF86AudioPause, spawn, playerctl play-pause  # play / pause
bind=none,XF86AudioPlay, spawn, playerctl play-pause  # play / pause
bind=none,XF86AudioPrev, spawn, playerctl previous  # previous track
bind=ALT,r,spawn,omvoid-cmd-radio  # radio
bind=ALT,a,spawn,omvoid-audioswitcher  # switch audio output
bind=ALT,v,spawn,rofi -modi clipboard:cliphist-rofi-img -show clipboard -show-icons -theme ~/.config/rofi/menu-style-clipboard.rasi  # clipboard
bind = ALT,t,spawn,setsid -f kitty -e tmux-start.sh  # tmux session
bind = ALT,n,spawn,rofi_notes.sh  # notes
bind = ALT, B, spawn, omvoid-launch-browser  # browser
bind = ALT, W, spawn, ~/.config/rofi/wallpaper/wallpaper-wayland.sh  # change wallpaper
bind = ALT, q, spawn, wlogout  # power menu
bind = SUPER,f,spawn, setsid -f kitty -e yazi  # files in the terminal
bind = ALT,f,spawn, nautilus  # file manager
bind = SUPER,s,spawn, omvoid-cmd-ssh-launcher  # ssh
bind=ALT,l,spawn,swaylock  # lock screen
bind=ALT,m,spawn,~/.config/mango/scripts/crystal-dock.sh  # dock
bind=SUPER,m,spawn,omvoid-cmd-mihomo  # proxy
