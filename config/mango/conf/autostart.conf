exec_once=waybar -c ~/.config/waybar/config-mango -s ~/.config/waybar/style-mango.css 
exec_once=brightnessctl -s set 65000
exec_once=swayidle -w
exec_once=dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec_once=awww-daemon 
exec_once=omvoid-cmd-first-run
exec_once=~/.config/swayosd/launch.sh 
exec_once=omvoid-powerevent-monitor
exec_once=omvoid-battery-monitor-launcher 
exec_once=wl-clip-persist --clipboard regular 
exec_once=wl-paste --type text --watch cliphist store  # Stores only text data
exec_once=wl-paste --type image --watch cliphist store  # Stores only image data
exec_once=runsvdir -P ~/.config/service 
exec_once=omvoid-bar-playerctl-loop
exec_once=crystal-dock
