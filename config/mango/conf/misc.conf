# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle,compose:caps


# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
# Since mangowc 0.17 these three are device-rule options only; as plain
# keywords they are "Unknown keyword" and silently ignored -- which turns
# disable-while-typing back on (libinput's default). left_handed and
# middle_button_emulation were 0, their default, so only this one is kept.
device_rule=type:trackpad,disable_while_typing:0
swipe_min_threshold=1
# Keep the flat acceleration profile (1 = flat, 2 = adaptive).
trackpad_accel_profile=1

# Increase the base pointer speed.
trackpad_accel_speed=1.2
# mouse
# need relogin to make it apply
mouse_natural_scrolling=1

# Appearance
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=5
gap_outer_vertical=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2

